<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }
        
        .task-card {
            transition: all 0.2s ease;
        }
        
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        /* Animation for new task */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        /* Priority indicators */
        .priority-high::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ef4444;
            margin-right: 8px;
        }
        
        .priority-medium::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #f59e0b;
            margin-right: 8px;
        }
        
        .priority-low::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #10b981;
            margin-right: 8px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-indigo-700">TaskFlow</h1>
                <p class="text-gray-600">Your daily task companion</p>
            </div>
            <div class="flex items-center space-x-4">
                <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200">
                    <i class="fas fa-moon "></i>
                </button>
                <div class="relative">
                    <button id="user-menu" class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center">
                        <i class="fas fa-user"></i>
                    </button>
                </div>
            </div>
        </header>
        
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-gray-800">Create New Task</h2>
                <div class="flex space-x-2">
                    <button id="clear-form" class="px-3 py-1 bg-gray-100 text-gray-600 rounded-md hover:bg-gray-200">
                        <i class="fas fa-broom mr-1"></i> Clear
                    </button>
                </div>
            </div>
            
            <form id="task-form" class="space-y-4">
                <div>
                    <label for="task-title" class="block text-sm font-medium text-gray-700 mb-1">Task Title</label>
                    <input type="text" id="task-title" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="What needs to be done?" required>
                </div>
                
                <div>
                    <label for="task-description" class="block text-sm font-medium text-gray-700 mb-1">Description (Optional)</label>
                    <textarea id="task-description" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" rows="2" placeholder="Add more details about your task..."></textarea>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="task-category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                        <select id="task-category" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="health">Health</option>
                            <option value="learning">Learning</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="task-priority" class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                        <select id="task-priority" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="task-due-date" class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
                        <input type="date" id="task-due-date" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                
                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors">
                        <i class="fas fa-plus mr-2"></i> Add Task
                    </button>
                </div>
            </form>
        </div>
        
        <div class="flex flex-col md:flex-row gap-6">
            <!-- Task Summary -->
            <div class="bg-white rounded-xl shadow-md p-6 flex-1">
                <h2 class="text-xl font-semibold text-gray-800 mb-6">Task Summary</h2>
                
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="bg-indigo-50 rounded-lg p-4 text-center">
                        <h3 class="text-sm font-medium text-indigo-700 mb-1">Total Tasks</h3>
                        <p id="total-tasks" class="text-2xl font-bold text-indigo-900">0</p>
                    </div>
                    <div class="bg-yellow-50 rounded-lg p-4 text-center">
                        <h3 class="text-sm font-medium text-yellow-700 mb-1">Pending</h3>
                        <p id="pending-tasks" class="text-2xl font-bold text-yellow-900">0</p>
                    </div>
                    <div class="bg-green-50 rounded-lg p-4 text-center">
                        <h3 class="text-sm font-medium text-green-700 mb-1">Completed</h3>
                        <p id="completed-tasks" class="text-2xl font-bold text-green-900">0</p>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-medium text-gray-700">Daily Progress</span>
                        <span id="progress-percent" class="text-sm font-medium text-indigo-700">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="bg-white rounded-xl shadow-md p-6 w-full md:w-64">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Quick Actions</h2>
                
                <div class="space-y-3">
                    <button id="complete-all" class="w-full flex items-center justify-between px-4 py-2 bg-green-50 text-green-700 rounded-md hover:bg-green-100 transition-colors">
                        <span>Complete All</span>
                        <i class="fas fa-check-double"></i>
                    </button>
                    
                    <button id="clear-completed" class="w-full flex items-center justify-between px-4 py-2 bg-red-50 text-red-700 rounded-md hover:bg-red-100 transition-colors">
                        <span>Clear Completed</span>
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    
                    <button id="sort-by-priority" class="w-full flex items-center justify-between px-4 py-2 bg-yellow-50 text-yellow-700 rounded-md hover:bg-yellow-100 transition-colors">
                        <span>Sort by Priority</span>
                        <i class="fas fa-sort-amount-up"></i>
                    </button>
                    
                    <button id="sort-by-date" class="w-full flex items-center justify-between px-4 py-2 bg-blue-50 text-blue-700 rounded-md hover:bg-blue-100 transition-colors">
                        <span>Sort by Date</span>
                        <i class="far fa-calendar-alt"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="mt-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-gray-800">Your Tasks</h2>
                <div class="relative">
                    <select id="task-filter" class="appearance-none bg-white border border-gray-300 rounded-md px-4 py-2 pr-8 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="all">All Tasks</option>
                        <option value="pending">Pending Only</option>
                        <option value="completed">Completed Only</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="health">Health</option>
                        <option value="learning">Learning</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </div>
            
            <div id="task-list" class="space-y-4">
                <!-- Tasks will be dynamically added here -->
                <div class="bg-gray-100 rounded-lg p-4 text-center text-gray-500">
                    <p>No tasks added yet. Create your first task above!</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const taskForm = document.getElementById('task-form');
            const taskTitle = document.getElementById('task-title');
            const taskDescription = document.getElementById('task-description');
            const taskCategory = document.getElementById('task-category');
            const taskPriority = document.getElementById('task-priority');
            const taskDueDate = document.getElementById('task-due-date');
            const clearFormButton = document.getElementById('clear-form');
            const taskList = document.getElementById('task-list');
            const taskFilter = document.getElementById('task-filter');
            const completeAllButton = document.getElementById('complete-all');
            const clearCompletedButton = document.getElementById('clear-completed');
            const sortByPriorityButton = document.getElementById('sort-by-priority');
            const sortByDateButton = document.getElementById('sort-by-date');
            const themeToggle = document.getElementById('theme-toggle');
            const totalTasksElement = document.getElementById('total-tasks');
            const pendingTasksElement = document.getElementById('pending-tasks');
            const completedTasksElement = document.getElementById('completed-tasks');
            const progressBar = document.getElementById('progress-bar');
            const progressPercent = document.getElementById('progress-percent');
            
            // Task storage
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            
            // Initialize the app
            function init() {
                renderTasks();
                updateSummary();
                setCurrentDate();
            }
            
            // Set current date as default
            function setCurrentDate() {
                const today = new Date().toISOString().split('T')[0];
                taskDueDate.value = today;
            }
            
            // Form submission
            taskForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const newTask = {
                    id: Date.now(),
                    title: taskTitle.value,
                    description: taskDescription.value,
                    category: taskCategory.value,
                    priority: taskPriority.value,
                    dueDate: taskDueDate.value,
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                
                tasks.push(newTask);
                saveTasks();
                renderTasks();
                updateSummary();
                taskForm.reset();
                setCurrentDate();
            });
            
            // Clear form
            clearFormButton.addEventListener('click', function() {
                taskForm.reset();
                setCurrentDate();
            });
            
            // Save tasks to localStorage
            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }
            
            // Render tasks based on filter
            function renderTasks() {
                const filter = taskFilter.value;
                let filteredTasks = [...tasks];
                
                if (filter === 'pending') {
                    filteredTasks = tasks.filter(task => !task.completed);
                } else if (filter === 'completed') {
                    filteredTasks = tasks.filter(task => task.completed);
                } else if (filter !== 'all') {
                    filteredTasks = tasks.filter(task => task.category === filter);
                }
                
                if (filteredTasks.length === 0) {
                    taskList.innerHTML = `
                        <div class="bg-gray-100 rounded-lg p-4 text-center text-gray-500">
                            <p>No tasks found for this filter.</p>
                        </div>
                    `;
                    return;
                }
                
                taskList.innerHTML = '';
                
                filteredTasks.forEach(task => {
                    const taskCard = document.createElement('div');
                    taskCard.className = `task-card bg-white rounded-xl shadow-sm p-4 border-l-4 ${getPriorityBorderColor(task.priority)} fade-in`;
                    
                    const completionStatus = task.completed ? 'line-through text-gray-400' : '';
                    
                    const dueDateText = task.dueDate ? 
                        `Due: ${formatDate(task.dueDate)}` : 
                        'No due date';
                    
                    const dueDateClass = isOverdue(task.dueDate) && !task.completed ? 
                        'text-red-500' : 
                        'text-gray-500';
                    
                    taskCard.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center">
                                <button class="complete-btn mr-3 w-6 h-6 rounded-full border-2 ${task.completed ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-gray-300'}" data-id="${task.id}">
                                    <i class="fas fa-check text-xs"></i>
                                </button>
                                <div>
                                    <h3 class="font-medium text-gray-800 ${completionStatus}">${task.title}</h3>
                                    <p class="text-sm text-gray-500 ${completionStatus}">${task.category.charAt(0).toUpperCase() + task.category.slice(1)} • ${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)} Priority</p>
                                </div>
                            </div>
                            <button class="delete-btn text-gray-400 hover:text-red-500" data-id="${task.id}">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                        
                        ${task.description ? `<p class="text-sm text-gray-600 mb-3 ml-9 ${completionStatus}">${task.description}</p>` : ''}
                        
                        <div class="flex justify-between items-center text-xs">
                            <span class="${dueDateClass}">${dueDateText}</span>
                            <div class="flex space-x-2">
                                <button class="edit-btn px-2 py-1 bg-gray-100 text-gray-600 rounded hover:bg-gray-200" data-id="${task.id}">
                                    <i class="fas fa-pencil-alt mr-1"></i> Edit
                                </button>
                            </div>
                        </div>
                    `;
                    
                    taskList.appendChild(taskCard);
                });
                
                // Add event listeners to the buttons in the newly created task cards
                addTaskEventListeners();
            }
            
            // Add event listeners to task buttons
            function addTaskEventListeners() {
                // Complete buttons
                document.querySelectorAll('.complete-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const taskId = parseInt(this.getAttribute('data-id'));
                        toggleTaskCompletion(taskId);
                    });
                });
                
                // Delete buttons
                document.querySelectorAll('.delete-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const taskId = parseInt(this.getAttribute('data-id'));
                        deleteTask(taskId);
                    });
                });
                
                // Edit buttons
                document.querySelectorAll('.edit-btn').forEach(button => {
                    button.addEventListener('click', function() {
                        const taskId = parseInt(this.getAttribute('data-id'));
                        editTask(taskId);
                    });
                });
            }
            
            // Toggle task completion status
            function toggleTaskCompletion(taskId) {
                const taskIndex = tasks.findIndex(task => task.id === taskId);
                if (taskIndex !== -1) {
                    tasks[taskIndex].completed = !tasks[taskIndex].completed;
                    saveTasks();
                    renderTasks();
                    updateSummary();
                }
            }
            
            // Delete a task
            function deleteTask(taskId) {
                if (confirm('Are you sure you want to delete this task?')) {
                    tasks = tasks.filter(task => task.id !== taskId);
                    saveTasks();
                    renderTasks();
                    updateSummary();
                }
            }
            
            // Edit a task (simplified version)
            function editTask(taskId) {
                const task = tasks.find(task => task.id === taskId);
                if (task) {
                    taskTitle.value = task.title;
                    taskDescription.value = task.description || '';
                    taskCategory.value = task.category;
                    taskPriority.value = task.priority;
                    taskDueDate.value = task.dueDate || '';
                    
                    // Remove the task from the list
                    tasks = tasks.filter(t => t.id !== taskId);
                    saveTasks();
                    renderTasks();
                    updateSummary();
                    
                    // Scroll to the form
                    taskTitle.focus();
                }
            }
            
            // Filter tasks
            taskFilter.addEventListener('change', function() {
                renderTasks();
            });
            
            // Complete all tasks
            completeAllButton.addEventListener('click', function() {
                if (tasks.length > 0) {
                    if (confirm('Mark all tasks as completed?')) {
                        tasks.forEach(task => {
                            task.completed = true;
                        });
                        saveTasks();
                        renderTasks();
                        updateSummary();
                    }
                }
            });
            
            // Clear completed tasks
            clearCompletedButton.addEventListener('click', function() {
                const completedTasks = tasks.filter(task => task.completed);
                if (completedTasks.length > 0) {
                    if (confirm('Delete all completed tasks?')) {
                        tasks = tasks.filter(task => !task.completed);
                        saveTasks();
                        renderTasks();
                        updateSummary();
                    }
                }
            });
            
            // Sort by priority
            sortByPriorityButton.addEventListener('click', function() {
                tasks.sort((a, b) => {
                    const priorityOrder = { high: 3, medium: 2, low: 1 };
                    return priorityOrder[b.priority] - priorityOrder[a.priority];
                });
                saveTasks();
                renderTasks();
            });
            
            // Sort by date
            sortByDateButton.addEventListener('click', function() {
                tasks.sort((a, b) => {
                    const dateA = a.dueDate ? new Date(a.dueDate) : new Date(0);
                    const dateB = b.dueDate ? new Date(b.dueDate) : new Date(0);
                    return dateA - dateB;
                });
                saveTasks();
                renderTasks();
            });
            
            // Toggle theme
            themeToggle.addEventListener('click', function() {
                document.documentElement.classList.toggle('dark');
                const icon = themeToggle.querySelector('i');
                if (document.documentElement.classList.contains('dark')) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
                localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            });
            
            // Check for saved theme preference
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                const icon = themeToggle.querySelector('i');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
            
            // Update summary statistics
            function updateSummary() {
                const total = tasks.length;
                const completed = tasks.filter(task => task.completed).length;
                const pending = total - completed;
                const progress = total > 0 ? Math.round((completed / total) * 100) : 0;
                
                totalTasksElement.textContent = total;
                pendingTasksElement.textContent = pending;
                completedTasksElement.textContent = completed;
                progressBar.style.width = `${progress}%`;
                progressPercent.textContent = `${progress}%`;
            }
            
            // Helper function to get priority border color
            function getPriorityBorderColor(priority) {
                return {
                    'high': 'border-red-500',
                    'medium': 'border-yellow-500',
                    'low': 'border-green-500'
                }[priority];
            }
            
            // Helper function to format date
            function formatDate(dateString) {
                if (!dateString) return '';
                const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
                return new Date(dateString).toLocaleDateString('en-US', options);
            }
            
            // Helper function to check if a task is overdue
            function isOverdue(dateString) {
                if (!dateString) return false;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const dueDate = new Date(dateString);
                return dueDate < today;
            }
            
            // Initialize the app
            init();
        });
    </script>
</body>
</html>
